<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Histórico de Acesso — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-6xl mx-auto px-4 py-10 flex-1">
    <div class="flex items-center gap-3 mb-2">
        <div class="bg-[#2E5B37] text-white w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold">AD</div>
        <h1 class="text-2xl font-bold text-[#2E5B37]">Administrador do Museu</h1>
    </div>
    <p class="text-gray-500 text-sm mb-8">Histórico de ações realizadas pelos usuários no sistema</p>

    <div class="bg-white rounded-xl overflow-hidden shadow-2xl" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">
        <table class="w-full text-sm">
            <thead class="bg-[#2E5B37] text-white">
                <tr>
                    <th class="px-4 py-3 text-left">Data/Hora</th>
                    <th class="px-4 py-3 text-left">Usuário</th>
                    <th class="px-4 py-3 text-left">Ação</th>
                    <th class="px-4 py-3 text-left">Obra</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${registros.isEmpty()}">
                    <td colspan="4" class="px-4 py-10 text-center text-gray-400">
                        <div class="text-3xl mb-2 opacity-40">📋</div>
                        Nenhum registro encontrado
                    </td>
                </tr>
                <tr th:each="r : ${registros}" class="border-t border-gray-100 hover:bg-gray-50">
                    <td class="px-4 py-3 text-gray-600" th:text="${#temporals.format(r.data, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="px-4 py-3 text-[#2E5B37] font-medium" th:text="${r.usuario.nomeUsuario}"></td>
                    <td class="px-4 py-3">
                        <span class="bg-[#2E5B37]/10 text-[#2E5B37] px-2.5 py-1 rounded-full text-xs font-bold"
                              th:text="${r.operacao}"></span>
                    </td>
                    <td class="px-4 py-3 text-gray-600" th:text="${r.getNomeObra()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
