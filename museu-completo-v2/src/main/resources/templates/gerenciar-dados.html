<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gerenciar Dados — Museu Treze de Maio</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-6xl mx-auto px-4 py-10 flex-1">
    <h1 class="text-2xl font-bold text-[#2E5B37] mb-1">Gerenciar Dados</h1>
    <p class="text-gray-500 text-sm mb-8">Edite ou remova autores, editoras e assuntos</p>

    <div id="mensagem" class="mb-6"></div>

    <div class="grid md:grid-cols-3 gap-8">

        <!-- AUTORES -->
        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-4 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Autores
            </h3>
            <ul id="listaAutores" class="space-y-2 mb-4 max-h-96 overflow-y-auto">
                <li class="text-gray-400 text-sm py-2">Carregando...</li>
            </ul>
        </div>

        <!-- EDITORAS -->
        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-4 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Editoras
            </h3>
            <ul id="listaEditoras" class="space-y-2 mb-4 max-h-96 overflow-y-auto">
                <li class="text-gray-400 text-sm py-2">Carregando...</li>
            </ul>
        </div>

        <!-- ASSUNTOS -->
        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-4 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Assuntos
            </h3>
            <ul id="listaAssuntos" class="space-y-2 mb-4 max-h-96 overflow-y-auto">
                <li class="text-gray-400 text-sm py-2">Carregando...</li>
            </ul>
        </div>
    </div>
</main>

<!-- MODAL DE EDIÇÃO -->
<div id="modalEdicao" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 shadow-lg">
        <h2 class="text-lg font-bold text-[#2E5B37] mb-4">Editar</h2>
        <form id="formEdicao" class="space-y-3">
            <input type="hidden" id="edicaoId">
            <input type="hidden" id="edicaoTipo">

            <div id="camposEdicao"></div>

            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="button" onclick="fecharModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button type="submit"
                        class="flex-1 px-4 py-2 bg-[#2E5B37] text-white rounded-lg text-sm font-medium hover:bg-[#1f4026] transition-colors">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL DE CONFIRMAÇÃO EXCLUSÃO -->
<div id="modalConfirmacao" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-lg">
        <h2 class="text-lg font-bold text-gray-900 mb-2">Confirmar exclusão?</h2>
        <p id="textoConfirmacao" class="text-gray-600 text-sm mb-6"></p>

        <div class="flex gap-3">
            <button type="button" onclick="fecharConfirmacao()"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                Cancelar
            </button>
            <button type="button" onclick="confirmarExclusao()"
                    class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition-colors">
                Excluir
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragmentos :: rodape}"></footer>

<script>
    let itemParaExcluir = null;
    let tipoItemExcluir = null;

    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    // Carregar dados
    window.addEventListener('DOMContentLoaded', () => {
        carregarAutores();
        carregarEditoras();
        carregarAssuntos();
    });

    // ===== AUTORES =====
    async function carregarAutores() {
        try {
            const response = await fetch('/autores', { cache: 'no-store' });
            const todosAutores = await response.json();
            /*
             Filtrei o "Autor desconhecido" pra não aparecer aqui. Ele é só um fallback
             criado automaticamente (em AutorService) pra receber as obras quando o autor
             original delas é excluído, então não faz sentido editar/excluir ele na tela
             de gerenciamento. Fiz isso pra esconder ele da lista.
             Ass: Mribas
            */
            const autores = todosAutores.filter(autor => autor.nome.toLowerCase() !== 'autor desconhecido');

            const lista = document.getElementById('listaAutores');

            if (autores.length === 0) {
                lista.innerHTML = '<li class="text-gray-400 text-sm py-2">Nenhum autor cadastrado</li>';
                return;
            }

            lista.innerHTML = autores.map(autor => `
                <li class="flex items-center justify-between p-3 bg-gray-50 rounded-lg group hover:bg-gray-100 transition-colors">
                    <span class="text-sm text-gray-700">
                        <strong>${autor.nome}</strong>
                        ${autor.nacionalidade ? `<br><span class="text-xs text-gray-500">${autor.nacionalidade}</span>` : ''}
                    </span>
                    <div class="flex gap-2 opacity-30 group-hover:opacity-100 transition-opacity">
                        <button type="button" onclick="abrirEdicaoAutor(${autor.id}, '${autor.nome}', '${autor.nacionalidade || ''}')"
                                class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar">
                            ✎
                        </button>
                        <button type="button" onclick="abrirConfirmacaoExclusao(${autor.id}, 'AUTOR', '${autor.nome}')"
                                class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                            🗑
                        </button>
                    </div>
                </li>
            `).join('');
        } catch (error) {
            console.error('Erro ao carregar autores:', error);
            document.getElementById('listaAutores').innerHTML = '<li class="text-red-500 text-sm py-2">Erro ao carregar</li>';
        }
    }

    async function abrirEdicaoAutor(id, nome, nacionalidade) {
        document.getElementById('edicaoId').value = id;
        document.getElementById('edicaoTipo').value = 'AUTOR';
        document.getElementById('camposEdicao').innerHTML = `
            <input type="text" id="nomeEdicao" value="${nome}" required placeholder="Nome *"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
            <br>
            <input type="text" id="nacionalidadeEdicao" value="${nacionalidade}" placeholder="Nacionalidade"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
        `;
        document.getElementById('modalEdicao').classList.remove('hidden');
    }

    // ===== EDITORAS =====
    async function carregarEditoras() {
        try {
            const response = await fetch('/editoras');
            const editoras = await response.json();

            const lista = document.getElementById('listaEditoras');

            if (editoras.length === 0) {
                lista.innerHTML = '<li class="text-gray-400 text-sm py-2">Nenhuma editora cadastrada</li>';
                return;
            }

            lista.innerHTML = editoras.map(editora => `
                <li class="flex items-center justify-between p-3 bg-gray-50 rounded-lg group hover:bg-gray-100 transition-colors">
                    <span class="text-sm text-gray-700"><strong>${editora.nome}</strong></span>
                    <div class="flex gap-2 opacity-30 group-hover:opacity-100 transition-opacity">
                        <button type="button" onclick="abrirEdicaoEditora(${editora.id}, '${editora.nome}')"
                                class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar">
                            ✎
                        </button>
                        <button type="button" onclick="abrirConfirmacaoExclusao(${editora.id}, 'EDITORA', '${editora.nome}')"
                                class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                            🗑
                        </button>
                    </div>
                </li>
            `).join('');
        } catch (error) {
            console.error('Erro ao carregar editoras:', error);
            document.getElementById('listaEditoras').innerHTML = '<li class="text-red-500 text-sm py-2">Erro ao carregar</li>';
        }
    }

    async function abrirEdicaoEditora(id, nome) {
        document.getElementById('edicaoId').value = id;
        document.getElementById('edicaoTipo').value = 'EDITORA';
        document.getElementById('camposEdicao').innerHTML = `
            <input type="text" id="nomeEdicao" value="${nome}" required placeholder="Nome *"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
        `;
        document.getElementById('modalEdicao').classList.remove('hidden');
    }

    // ===== ASSUNTOS =====
    async function carregarAssuntos() {
        try {
            const response = await fetch('/assuntos');
            const assuntos = await response.json();

            const lista = document.getElementById('listaAssuntos');

            if (assuntos.length === 0) {
                lista.innerHTML = '<li class="text-gray-400 text-sm py-2">Nenhum assunto cadastrado</li>';
                return;
            }

            lista.innerHTML = assuntos.map(assunto => `
                <li class="flex items-center justify-between p-3 bg-gray-50 rounded-lg group hover:bg-gray-100 transition-colors">
                    <span class="text-sm text-gray-700"><strong>${assunto.descricao}</strong></span>
                    <div class="flex gap-2 opacity-30 group-hover:opacity-100 transition-opacity">
                        <button type="button" onclick="abrirEdicaoAssunto(${assunto.id}, '${assunto.descricao}')"
                                class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar">
                            ✎
                        </button>
                        <button type="button" onclick="abrirConfirmacaoExclusao(${assunto.id}, 'ASSUNTO', '${assunto.descricao}')"
                                class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                            🗑
                        </button>
                    </div>
                </li>
            `).join('');
        } catch (error) {
            console.error('Erro ao carregar assuntos:', error);
            document.getElementById('listaAssuntos').innerHTML = '<li class="text-red-500 text-sm py-2">Erro ao carregar</li>';
        }
    }

    async function abrirEdicaoAssunto(id, descricao) {
        document.getElementById('edicaoId').value = id;
        document.getElementById('edicaoTipo').value = 'ASSUNTO';
        document.getElementById('camposEdicao').innerHTML = `
            <input type="text" id="descricaoEdicao" value="${descricao}" required placeholder="Descrição *"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
        `;
        document.getElementById('modalEdicao').classList.remove('hidden');
    }

    // ===== MODAL EDIÇÃO =====
    function fecharModal() {
        document.getElementById('modalEdicao').classList.add('hidden');
    }

    document.getElementById('formEdicao').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('edicaoId').value;
        const tipo = document.getElementById('edicaoTipo').value;
        let endpoint = '';
        let payload = {};

        if (tipo === 'AUTOR') {
            endpoint = `/dados/autor/${id}`;
            payload = {
                nome: document.getElementById('nomeEdicao').value,
                nacionalidade: document.getElementById('nacionalidadeEdicao').value
            };
        } else if (tipo === 'EDITORA') {
            endpoint = `/dados/editora/${id}`;
            payload = {
                nome: document.getElementById('nomeEdicao').value
            };
        } else if (tipo === 'ASSUNTO') {
            endpoint = `/dados/assunto/${id}`;
            payload = {
                descricao: document.getElementById('descricaoEdicao').value
            };
        }

        try {
            const response = await fetch(endpoint, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams(payload)
            });

            if (response.ok) {
                fecharModal();
                mostrarMensagem('Alterado com sucesso!', 'sucesso');

                if (tipo === 'AUTOR') carregarAutores();
                else if (tipo === 'EDITORA') carregarEditoras();
                else if (tipo === 'ASSUNTO') carregarAssuntos();
            } else {
                mostrarMensagem('Erro ao alterar', 'erro');
            }
        } catch (error) {
            console.error('Erro:', error);
            mostrarMensagem('Erro ao alterar', 'erro');
        }
    });

    // ===== MODAL CONFIRMAÇÃO =====
    function abrirConfirmacaoExclusao(id, tipo, nome) {
        itemParaExcluir = id;
        tipoItemExcluir = tipo;
        document.getElementById('textoConfirmacao').textContent = `Tem certeza que deseja excluir "${nome}"?`;
        document.getElementById('modalConfirmacao').classList.remove('hidden');
    }

    function fecharConfirmacao() {
        document.getElementById('modalConfirmacao').classList.add('hidden');
        itemParaExcluir = null;
        tipoItemExcluir = null;
    }

    async function confirmarExclusao() {
        let endpoint = '';
        const tipo = tipoItemExcluir;

        if (tipo === 'AUTOR') {
            endpoint = `/dados/autor/${itemParaExcluir}`;
        } else if (tipo === 'EDITORA') {
            endpoint = `/dados/editora/${itemParaExcluir}`;
        } else if (tipo === 'ASSUNTO') {
            endpoint = `/dados/assunto/${itemParaExcluir}`;
        }

        try {
            const response = await fetch(endpoint, {
                method: 'DELETE',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            fecharConfirmacao();


            if (response.ok) {
                mostrarMensagem('Excluído com sucesso!', 'excluido');

                if (tipo === 'AUTOR') carregarAutores();
                else if (tipo === 'EDITORA') carregarEditoras();
                else if (tipo === 'ASSUNTO') carregarAssuntos();
            } else {
                const erro = await response.text();
                mostrarMensagem(erro || 'Não é possível excluir este item', 'erro');
            }
        } catch (error) {
            console.error('Erro:', error);
            mostrarMensagem('Erro ao excluir', 'erro');
        }
    }

    // ===== MENSAGENS =====
    function mostrarMensagem(texto, tipo) {
        const div = document.getElementById('mensagem');

        let classes = 'p-4 rounded-lg text-sm font-medium transition-all animate-pulse';
        if (tipo === 'sucesso') {
            classes += ' bg-yellow-100 text-yellow-800 border border-yellow-300';
        } else if (tipo === 'excluido') {
            classes += ' bg-red-100 text-red-800 border border-red-300';
        } else {
            classes += ' bg-red-100 text-red-800 border border-red-300';
        }

        div.innerHTML = `<div class="${classes}">${texto}</div>`;

        setTimeout(() => {
            div.innerHTML = '';
        }, 3000);
    }
</script>
</body>
</html>
