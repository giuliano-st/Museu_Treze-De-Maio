<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-sm p-8">
        <div class="text-center mb-8">
            <div class="bg-[#2E5B37] text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">👤</div>
            <h2 class="text-[#2E5B37] text-2xl font-bold">Criar Conta</h2>
        </div>

        <div th:if="${erro}" class="bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm mb-4">
            <span th:text="${erro}"></span>
        </div>

        <form method="post" action="/register" class="space-y-4">
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">Nome</label>
                <input type="text" name="nomeUsuario" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
            </div>
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">E-mail</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
            </div>
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">Senha</label>
                <input type="password" name="senha" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
            </div>
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">Cargo</label>
                <select name="role" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none bg-white transition-all">
                    <option value="BIBLIOTECARIO">Bibliotecário</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-[#2E5B37] text-white py-3 rounded-lg font-bold hover:bg-[#1f4026] transition-colors shadow-sm mt-2">
                Criar Conta
            </button>
            <p class="text-center text-gray-500 text-sm">
                Já tem conta? <a href="/login" class="text-[#2E5B37] font-semibold hover:underline">Faça Login</a>
            </p>
        </form>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
