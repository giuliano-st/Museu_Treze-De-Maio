<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>Acervo Digital</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-7xl mx-auto px-4 py-10 flex-1">

    <div class="text-center mb-10">

        <h1 class="text-4xl font-bold text-[#2E5B37] mb-2">
            Acervo Digital
        </h1>

        <p class="text-gray-500">
            Explore livros, jornais e revistas do museu
        </p>

    </div>

    <div class="flex flex-col lg:flex-row gap-8">

        <!-- FILTROS -->
        <aside class="lg:w-72 shrink-0">

            <form method="get"
                  action="/pesquisa"
                  class="bg-white rounded-xl p-5 sticky top-20 shadow-2xl space-y-5"
                  style="box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);">

                <div>

                    <label class="block text-sm font-medium text-[#2E5B37] mb-2">
                        Buscar
                    </label>

                    <input type="text"
                           name="termo"
                           th:value="${termo}"
                           placeholder="Título ou autor..."
                           class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#2E5B37]/20 focus:border-[#2E5B37] outline-none">

                </div>

                <div>

                    <label class="block text-sm font-medium text-[#2E5B37] mb-2">
                        Tipo
                    </label>

                    <div class="space-y-2">

                        <label class="block">
                            <input type="radio"
                                   name="tipo"
                                   value=""
                                   th:checked="${tipo == null or tipo == ''}">
                            Todos
                        </label>

                        <label class="block">
                            <input type="radio"
                                   name="tipo"
                                   value="LIVRO"
                                   th:checked="${tipo == 'LIVRO'}">
                            Livro
                        </label>

                        <label class="block">
                            <input type="radio"
                                   name="tipo"
                                   value="REVISTA"
                                   th:checked="${tipo == 'REVISTA'}">
                            Revista
                        </label>

                        <label class="block">
                            <input type="radio"
                                   name="tipo"
                                   value="JORNAL"
                                   th:checked="${tipo == 'JORNAL'}">
                            Jornal
                        </label>

                    </div>

                </div>

                <div>
                    <label class="block text-sm font-medium text-[#2E5B37] mb-2">
                        Período
                    </label>

                    <div class="space-y-2">
                        <input type="number"
                               name="dataInicio"
                               th:value="${dataInicio}"
                               placeholder="Ano inicial"
                               min="0000"
                               max="2099"
                               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#2E5B37]/20 focus:border-[#2E5B37] outline-none">

                        <input type="number"
                               name="dataFim"
                               th:value="${dataFim}"
                               placeholder="Ano final"
                               min="0000"
                               max="2099"
                               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#2E5B37]/20 focus:border-[#2E5B37] outline-none">
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-[#2E5B37] text-white py-2.5 rounded-lg hover:bg-[#23452a] transition">

                    Pesquisar

                </button>

                <a href="/pesquisa"
                   class="block text-center text-gray-500 hover:text-[#2E5B37] text-sm">

                    Limpar filtros

                </a>

            </form>

        </aside>

        <!-- RESULTADOS -->
        <section class="flex-1">

            <div class="mb-5 text-sm text-gray-500">

                <span th:text="${#lists.size(obras)}">
                    0
                </span>

                obra(s) encontrada(s)

            </div>

            <div th:if="${#lists.isEmpty(obras)}"
                 class="bg-white border rounded-xl p-12 text-center">

                <div class="text-6xl mb-4">
                    📚
                </div>

                <h3 class="text-lg font-semibold text-gray-700">
                    Nenhuma obra encontrada
                </h3>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div th:each="obra : ${obras}"
                     class="bg-white rounded-xl overflow-hidden shadow-2xl hover:shadow-2xl hover:scale-105 transition duration-300 flex flex-col cursor-pointer"
                     style="box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);"
                     onmouseover="this.style.boxShadow='0 25px 50px -12px rgba(0, 0, 0, 1)'"
                     onmouseout="this.style.boxShadow='0 20px 25px -5px rgba(0, 0, 0, 0.25)'">
                    <!-- CAPA -->
                    <div class="h-72 bg-gray-100">

                        <img th:src="${obra.capa}"
                             th:alt="${obra.titulo_Principal}"
                             class="w-full h-full object-cover"/>

                    </div>

                    <!-- CONTEÚDO -->
                    <div class="p-5 flex flex-col flex-1">

                        <span
                                class="self-start text-xs px-3 py-1 rounded-full font-medium mb-3"

                                th:classappend="
                                ${obra.obra_tipo == 'LIVRO'}
                                ? ' bg-blue-100 text-blue-700'
                                : (${obra.obra_tipo == 'REVISTA'}
                                ? ' bg-purple-100 text-purple-700'
                                : ' bg-amber-100 text-amber-700')"

                                th:text="${obra.obra_tipo}">
                        </span>

                        <h2 class="font-bold text-[#2E5B37] text-lg mb-2"
                            th:text="${obra.titulo_Principal}">
                        </h2>

                        <p th:if="${obra.autor != null}"
                           class="text-sm text-gray-500 mb-1">

                            👤
                            <span th:text="${obra.autor.nome}">
                            </span>

                        </p>

                        <p th:if="${obra.data != null}"
                           class="text-sm text-gray-500 mb-4">

                            📅
                            <span th:text="${#temporals.format(obra.data,'dd/MM/yyyy')}">
                            </span>

                        </p>

                        <a th:href="@{/obra/{id}(id=${obra.id})}"
                           class="mt-auto bg-[#2E5B37] text-white text-center py-2.5 rounded-lg hover:bg-[#23452a] transition">

                            Ver detalhes

                        </a>

                    </div>

                </div>

            </div>

        </section>

    </div>

</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>

</body>
</html>
