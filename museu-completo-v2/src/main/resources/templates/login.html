<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Login — Museu Treze de Maio</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-2xl p-8" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">

            <!-- Cabeçalho -->
            <div class="text-center mb-8">

                <div
                        class="bg-[#2E5B37] text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-2xl" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">
                    🔑
                </div>

                <h1 class="text-3xl font-bold text-[#2E5B37]">
                    Entrar
                </h1>

                <p class="text-gray-500 mt-2">
                    Acesse o sistema do Museu Treze de Maio
                </p>

            </div>

            <!-- Erro de login -->
            <div
                    th:if="${param.erro}"
                    class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-5">

                E-mail ou senha inválidos.

            </div>

            <!-- Logout -->
            <div
                    th:if="${param.logout}"
                    class="bg-green-50 border border-green-200 text-green-700 rounded-lg p-4 mb-5">

                Logout realizado com sucesso.

            </div>

            <!-- Formulário -->
            <form
                    th:action="@{/login}"
                    method="post"
                    class="space-y-5">

                <div>

                    <label
                            for="email"
                            class="block mb-2 text-sm font-medium text-[#2E5B37]">

                        E-mail

                    </label>

                    <input
                            id="email"
                            type="email"
                            name="email"
                            required
                            autocomplete="email"
                            th:value="${param.email}"
                            placeholder="Digite seu e-mail"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-[#2E5B37]/20
                                   focus:border-[#2E5B37]
                                   transition-all"/>

                </div>

                <div>

                    <label
                            for="senha"
                            class="block mb-2 text-sm font-medium text-[#2E5B37]">

                        Senha

                    </label>

                    <input
                            id="senha"
                            type="password"
                            name="senha"
                            required
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-[#2E5B37]/20
                                   focus:border-[#2E5B37]
                                   transition-all"/>

                </div>

                <button
                        type="submit"
                        class="w-full bg-[#2E5B37]
                               hover:bg-[#23452a]
                               text-white
                               font-bold
                               py-3
                               rounded-lg
                               transition-colors
                               shadow-2xl" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">

                    Entrar

                </button>

            </form>

            <!-- Cadastro -->
            <div class="text-center mt-6">

                <p class="text-gray-500 text-sm">

                    Não possui conta?

                    <a
                            th:href="@{/register}"
                            class="text-[#2E5B37] font-semibold hover:underline">

                        Cadastre-se

                    </a>

                </p>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>

</body>
</html>
