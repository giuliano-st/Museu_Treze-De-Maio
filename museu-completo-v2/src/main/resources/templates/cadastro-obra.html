<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar Obra — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-4xl mx-auto px-4 py-8 flex-1">
    <a href="/cadastro" class="inline-flex items-center gap-2 text-[#2E5B37] hover:underline text-sm mb-6">← Voltar</a>

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8">
        <h1 class="text-[#2E5B37] text-2xl font-bold mb-8 text-center"
            th:text="${obra != null} ? 'Editar Obra' : 'Cadastrar Obra'"></h1>

        <form th:action="@{/cadastro/obra}" method="post" class="space-y-6">
            <input type="hidden" name="id" th:value="${obra != null} ? ${obra.id} : null"/>

            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Tipo *</label>
                    <select name="obra_tipo" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm bg-white transition-all">
                        <option value="LIVRO" th:selected="${obra != null and obra.obra_tipo == 'LIVRO'}">Livro</option>
                        <option value="JORNAL" th:selected="${obra != null and obra.obra_tipo == 'JORNAL'}">Jornal</option>
                        <option value="REVISTA" th:selected="${obra != null and obra.obra_tipo == 'REVISTA'}">Revista</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Título *</label>
                    <input type="text" name="titulo_Principal" required
                           th:value="${obra != null} ? ${obra.titulo_Principal} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Autor</label>
                    <select name="autorId" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm bg-white transition-all">
                        <option value="">Selecione</option>
                        <option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.nome}"
                                th:selected="${obra != null and obra.autor != null and obra.autor.id == a.id}"></option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Editora</label>
                    <select name="editoraId" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm bg-white transition-all">
                        <option value="">Selecione</option>
                        <option th:each="e : ${editoras}" th:value="${e.id}" th:text="${e.nome}"
                                th:selected="${obra != null and obra.editora != null and obra.editora.id == e.id}"></option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">ISBN</label>
                    <input type="text" name="isbn" th:value="${obra != null} ? ${obra.isbn} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">ISSN</label>
                    <input type="text" name="issn" th:value="${obra != null} ? ${obra.issn} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Série</label>
                    <input type="text" name="serie" th:value="${obra != null} ? ${obra.serie} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Edição</label>
                    <input type="text" name="edicao" th:value="${obra != null} ? ${obra.edicao} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Coleção</label>
                    <input type="text" name="colecao" th:value="${obra != null} ? ${obra.colecao} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Local</label>
                    <input type="text" name="local" th:value="${obra != null} ? ${obra.local} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Periodicidade</label>
                    <input type="text" name="periodicidade" th:value="${obra != null} ? ${obra.periodicidade} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">URL da Capa</label>
                    <input type="url" name="capa" th:value="${obra != null} ? ${obra.capa} : null"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"/>
                </div>
            </div>

            <div>
                <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Assuntos</label>
                <select name="assuntosIds" multiple class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm bg-white h-32 transition-all">
                    <option th:each="a : ${assuntos}" th:value="${a.id}" th:text="${a.descricao}"
                            th:selected="${obra != null and obra.assuntos != null and obra.assuntos.contains(a)}"></option>
                </select>
                <p class="text-xs text-gray-400 mt-1">Segure Ctrl para selecionar mais de um</p>
            </div>

            <div>
                <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Notas Gerais</label>
                <textarea rows="3" name="notasGerais" th:text="${obra != null} ? ${obra.notasGerais} : null"
                          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none text-sm transition-all"></textarea>
            </div>

            <div class="flex gap-4 pt-2">
                <button type="submit" class="flex-1 bg-[#2E5B37] text-white py-3 rounded-lg font-bold hover:bg-[#1f4026] transition-colors shadow-sm"
                        th:text="${obra != null} ? 'Salvar Alterações' : 'Cadastrar Obra'"></button>
                <a href="/cadastro" class="px-8 py-3 border border-gray-300 text-[#2E5B37] rounded-lg hover:bg-gray-50 text-center transition-colors">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
