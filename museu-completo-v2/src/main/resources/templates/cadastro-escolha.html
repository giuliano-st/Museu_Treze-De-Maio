<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-2xl mx-auto px-4 py-12 flex-1">
    <h1 class="text-3xl font-bold text-[#2E5B37] mb-2 text-center">O que deseja fazer?</h1>
    <p class="text-gray-500 text-center mb-10">Cadastre obras ou gerencie autores, editoras e assuntos</p>

    <div class="grid md:grid-cols-2 gap-6">
        <a href="/cadastro/obra"
           class="bg-white border border-gray-200 rounded-xl p-8 text-center shadow-sm hover:shadow-lg hover:border-[#2E5B37] hover:-translate-y-0.5 transition-all duration-200 group">
            <div class="text-5xl mb-4">📖</div>
            <h3 class="font-bold text-lg text-[#2E5B37]">Cadastrar Obra</h3>
            <p class="text-gray-500 text-sm mt-1">Livro, jornal ou revista</p>
        </a>
        <a href="/dados"
           class="bg-white border border-gray-200 rounded-xl p-8 text-center shadow-sm hover:shadow-lg hover:border-[#2E5B37] hover:-translate-y-0.5 transition-all duration-200 group">
            <div class="text-5xl mb-4">📁</div>
            <h3 class="font-bold text-lg text-[#2E5B37]">Gerenciar Dados</h3>
            <p class="text-gray-500 text-sm mt-1">Autores, editoras e assuntos</p>
        </a>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
