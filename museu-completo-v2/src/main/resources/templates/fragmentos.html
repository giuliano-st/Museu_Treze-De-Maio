<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<nav th:fragment="navbar"
     class="bg-[#2E5B37] shadow-md sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-4">

        <div class="flex justify-between items-center h-16">

            <!-- Logo -->
            <a href="/"
               class="flex items-center gap-3 text-white font-bold text-lg hover:opacity-90 transition">

                <span class="text-2xl">🏛️</span>

                <span class="hidden sm:block">
                    Museu Treze de Maio
                </span>

            </a>

            <!-- Menu -->
            <div class="flex items-center gap-2">

                <a href="/pesquisa"
                   class="text-white px-3 py-2 rounded-lg hover:bg-white/10 transition">
                    Acervo
                </a>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">

                    <a href="/cadastro"
                       class="text-white px-3 py-2 rounded-lg hover:bg-white/10 transition">
                        Cadastrar
                    </a>

                    <a href="/dados"
                       class="text-white px-3 py-2 rounded-lg hover:bg-white/10 transition">
                        Dados
                    </a>

                </th:block>

                <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                    <a href="/historico-acesso"
                       class="text-white px-3 py-2 rounded-lg hover:bg-white/10 transition">
                        Histórico
                    </a>

                </th:block>

                <!-- Usuário logado -->
                <th:block th:if="${#authorization.expression('isAuthenticated()')}">

                    <div class="relative group ml-3">

                        <button
                                class="flex items-center gap-3 bg-white/10 hover:bg-white/20 rounded-full px-3 py-1.5 transition">

                            <div class="w-9 h-9 rounded-full bg-white text-[#2E5B37]
                                        flex items-center justify-center font-bold">

                                <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">
                                    U
                                </span>

                            </div>

                            <div class="hidden md:flex flex-col items-start leading-tight">

                                <span class="text-white text-sm font-medium"
                                      th:text="${#authentication.name}">
                                </span>

                                <span class="text-white/70 text-xs">
                                    Usuário autenticado
                                </span>

                            </div>

                            <span class="text-white text-xs">
                                ▼
                            </span>

                        </button>

                        <!-- Dropdown -->
                        <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100
                                    opacity-0 invisible translate-y-2
                                    group-hover:opacity-100
                                    group-hover:visible
                                    group-hover:translate-y-0
                                    transition-all duration-200">

                            <div class="px-4 py-3 border-b">

                                <p class="text-xs text-gray-500">
                                    Conectado como
                                </p>

                                <p class="font-medium text-gray-800 break-all"
                                   th:text="${#authentication.name}">
                                </p>

                            </div>

                            <form th:action="@{/logout}" method="post">

                                <button type="submit"
                                        class="w-full text-left px-4 py-3 text-red-600 hover:bg-red-50 rounded-b-xl transition">

                                    🚪 Sair

                                </button>

                            </form>

                        </div>

                    </div>

                </th:block>

                <!-- Não logado -->
                <th:block th:if="${#authorization.expression('isAnonymous()')}">

                    <a href="/login"
                       class="bg-white text-[#2E5B37]
                              px-4 py-2 rounded-lg
                              font-semibold
                              hover:bg-gray-100
                              transition">

                        Entrar

                    </a>

                </th:block>

            </div>

        </div>

    </div>

</nav>

<footer th:fragment="rodape"
        class="bg-[#2E5B37] text-white mt-12">

    <div class="max-w-7xl mx-auto px-4 py-8">

        <div class="flex flex-col md:flex-row justify-between items-center gap-4">

            <p class="text-sm text-white/80">
                🏛️ Museu Treze de Maio — Sistema de Acervo Digital
            </p>

            <div class="flex items-center gap-6">

                <a href="https://www.instagram.com"
                   target="_blank"
                   class="text-white/80 hover:text-white transition">
                    Instagram
                </a>

                <a href="https://www.facebook.com"
                   target="_blank"
                   class="text-white/80 hover:text-white transition">
                    Facebook
                </a>

                <a href="https://wa.me/55"
                   target="_blank"
                   class="text-white/80 hover:text-white transition">
                    WhatsApp
                </a>

            </div>

        </div>

    </div>

</footer>

</body>
</html>
