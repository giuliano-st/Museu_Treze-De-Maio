<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dados — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-6xl mx-auto px-4 py-10 flex-1">
    <h1 class="text-2xl font-bold text-[#2E5B37] mb-1">Cadastrar Dados da Obra</h1>
    <p class="text-gray-500 text-sm mb-8">Cadastre autores, editoras e assuntos para usar nos formulários</p>

    <div th:if="${sucesso}" class="mb-6">
        <div class="p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-300">
            Dado salvo com sucesso!
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-8">

        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Autores
            </h3>
            <ul class="space-y-1 mb-4 max-h-48 overflow-y-auto">
                <li th:if="${autores.empty}" class="text-gray-400 text-sm py-2">Nenhum autor cadastrado</li>
                <li th:each="a : ${autores}" class="text-sm text-gray-700 border-b border-gray-100 py-1.5"
                    th:text="${a.nome} + (${a.nacionalidade} != null ? ' (' + ${a.nacionalidade} + ')' : '')"></li>
            </ul>
            <form th:action="@{/dados/autor}" method="post" class="space-y-2">
                <input type="text" name="nome" required placeholder="Nome *"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
                <input type="text" name="nacionalidade" placeholder="Nacionalidade"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
                <button type="submit" class="w-full bg-[#2E5B37] text-white py-2 rounded-lg text-sm font-medium hover:bg-[#1f4026] transition-colors">Adicionar</button>
            </form>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Editoras
            </h3>
            <ul class="space-y-1 mb-4 max-h-48 overflow-y-auto">
                <li th:if="${editoras.empty}" class="text-gray-400 text-sm py-2">Nenhuma editora cadastrada</li>
                <li th:each="e : ${editoras}" class="text-sm text-gray-700 border-b border-gray-100 py-1.5" th:text="${e.nome}"></li>
            </ul>
            <form th:action="@{/dados/editora}" method="post" class="space-y-2">
                <input type="text" name="nome" required placeholder="Nome *"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
                <button type="submit" class="w-full bg-[#2E5B37] text-white py-2 rounded-lg text-sm font-medium hover:bg-[#1f4026] transition-colors">Adicionar</button>
            </form>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
            <h3 class="text-[#2E5B37] font-bold mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2E5B37]"></span> Assuntos
            </h3>
            <ul class="space-y-1 mb-4 max-h-48 overflow-y-auto">
                <li th:if="${assuntos.empty}" class="text-gray-400 text-sm py-2">Nenhum assunto cadastrado</li>
                <li th:each="a : ${assuntos}" class="text-sm text-gray-700 border-b border-gray-100 py-1.5" th:text="${a.descricao}"></li>
            </ul>
            <form th:action="@{/dados/assunto}" method="post" class="space-y-2">
                <input type="text" name="descricao" required placeholder="Descrição *"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-[#2E5B37] focus:ring-2 focus:ring-[#2E5B37]/20 focus:outline-none transition-all"/>
                <button type="submit" class="w-full bg-[#2E5B37] text-white py-2 rounded-lg text-sm font-medium hover:bg-[#1f4026] transition-colors">Adicionar</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
