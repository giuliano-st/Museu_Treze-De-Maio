<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalhes — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-5xl mx-auto px-4 py-8 flex-1">
    <nav class="text-sm text-gray-500 mb-6 flex items-center gap-2">
        <a href="/" class="hover:text-[#2E5B37] transition-colors">Início</a>
        <span>/</span>
        <a href="/pesquisa" class="hover:text-[#2E5B37] transition-colors">Acervo</a>
        <span>/</span>
        <span class="text-[#2E5B37] font-medium" th:text="${obra.titulo_Principal}"></span>
    </nav>

    <div th:if="${isBibliotecario}" class="bg-[#2E5B37] text-white rounded-xl p-4 mb-6 flex flex-wrap gap-3 justify-between items-center shadow-2xl" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">
        <span class="font-semibold">Ações do Bibliotecário</span>
        <div class="flex flex-wrap gap-2">
            <a th:href="@{/cadastro/obra(editar=${obra.id})}"
               class="bg-white text-[#2E5B37] px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">Editar</a>
            <a th:href="@{/obra/{id}/exemplares(id=${obra.id})}"
               class="bg-white text-[#2E5B37] px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">Exemplares</a>
            <button type="button"
                    onclick="document.getElementById('modal-excluir-[[${obra.id}]]').classList.remove('hidden')"
                    class="bg-red-600 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-700 transition-colors">
                Excluir
            </button>

            <div id="modal-excluir-[[${obra.id}]]" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4">

                <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">

                    <div class="mx-auto mb-4 flex items-center justify-center h-14 w-14 rounded-full bg-red-50">
                        <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                        </svg>
                    </div>

                    <h3 class="text-xl font-semibold text-gray-900 mb-2">Excluir Obra</h3>
                    <p class="text-sm text-gray-500 mb-6">
                        Tem certeza que deseja excluir esta obra? Esta ação não poderá ser desfeita.
                    </p>

                    <div class="flex justify-center gap-3 w-full">

                        <button type="button"
                                onclick="document.getElementById('modal-excluir-[[${obra.id}]]').classList.add('hidden')"
                                class="w-1/2 px-4 py-2.5 bg-gray-100 text-gray-800 hover:bg-gray-200 rounded-lg font-medium transition-colors">
                            Cancelar
                        </button>

                        <form th:action="@{/obra/excluir/{id}(id=${obra.id})}" method="post" class="w-1/2 m-0">
                            <button type="submit"
                                    class="w-full h-full px-4 py-2.5 bg-red-600 text-white hover:bg-red-700 rounded-lg font-medium transition-colors">
                                Confirmar Exclusão
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-2xl p-8" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">
        <div class="grid md:grid-cols-2 gap-8">
            <div>
                <div class="rounded-xl overflow-hidden shadow-2xl" style="box-shadow: 0 15px 25px 1px rgba(0, 0, 0, 0.30);">
                    <img th:src="${obra.capa != null and !obra.capa.isEmpty()} ? ${obra.capa} : 'https://via.placeholder.com/400x600?text=Sem+Capa'"
                         th:alt="${obra.titulo_Principal}" class="w-full object-cover"/>
                </div>
                <span class="inline-block mt-4 px-3 py-1 rounded-full text-sm font-semibold"
                      th:classappend="${obra.obra_tipo == 'LIVRO'} ? 'bg-blue-100 text-blue-700' : (${obra.obra_tipo == 'REVISTA'} ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700')"
                      th:text="${obra.obra_tipo}"></span>
            </div>

            <div class="space-y-4">
                <h1 class="text-[#2E5B37] text-2xl font-bold leading-snug" th:text="${obra.titulo_Principal}"></h1>

                <div class="space-y-3 text-sm">
                    <div th:if="${obra.autor != null}">
                        <p class="text-gray-400 text-xs uppercase tracking-wide">Autor</p>
                        <p class="font-medium text-gray-800" th:text="${obra.autor.nome}"></p>
                    </div>
                    <div th:if="${obra.editora != null}">
                        <p class="text-gray-400 text-xs uppercase tracking-wide">Editora</p>
                        <p class="font-medium text-gray-800" th:text="${obra.editora.nome}"></p>
                    </div>
                    <div th:if="${obra.isbn}">
                        <p class="text-gray-400 text-xs uppercase tracking-wide">ISBN</p>
                        <p class="font-medium text-gray-800" th:text="${obra.isbn}"></p>
                    </div>
                    <div th:if="${obra.serie}">
                        <p class="text-gray-400 text-xs uppercase tracking-wide">Série</p>
                        <p class="font-medium text-gray-800" th:text="${obra.serie}"></p>
                    </div>
                    <div th:if="${obra.assuntos != null and !obra.assuntos.isEmpty()}">
                        <p class="text-gray-400 text-xs uppercase tracking-wide mb-1.5">Assuntos</p>
                        <div class="flex flex-wrap gap-1.5">
                            <span th:each="a : ${obra.assuntos}"
                                  class="bg-[#2E5B37]/10 text-[#2E5B37] px-2.5 py-1 rounded-full text-xs font-medium"
                                  th:text="${a.descricao}"></span>
                        </div>
                    </div>
                </div>

                <div th:if="${exemplares != null and !exemplares.isEmpty()}" class="border-t border-gray-100 pt-4 mt-4">
                    <p class="text-[#2E5B37] font-semibold mb-3">Exemplares</p>
                    <div class="space-y-2">
                        <div th:each="ex : ${exemplares}" class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2.5 text-sm">
                            <span class="text-gray-700">Exemplar Nº <span class="font-medium" th:text="${ex.numero}"></span></span>
                            <span th:text="${ex.disponibilidade ? 'Disponível' : 'Indisponível'}"
                                  th:classappend="${ex.disponibilidade} ? 'text-green-700 bg-green-100' : 'text-red-700 bg-red-100'"
                                  class="font-medium text-xs px-2 py-1 rounded-full"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
