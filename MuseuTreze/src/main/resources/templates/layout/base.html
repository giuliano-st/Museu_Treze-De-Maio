<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Museu Treze">Museu Treze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #dee2e6; }
        .sidebar .nav-link { color: #495057; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #0d6efd; background: #e9ecef; border-radius: 6px; }
        .content-area { padding: 2rem; }
        .alert { border-radius: 8px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <i class="bi bi-building-fill-check me-2"></i>Museu Treze
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 sidebar py-3">
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/obras}">
                        <i class="bi bi-book me-2"></i>Obras
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/autores}">
                        <i class="bi bi-person me-2"></i>Autores
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/editoras}">
                        <i class="bi bi-building me-2"></i>Editoras
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/assuntos}">
                        <i class="bi bi-tag me-2"></i>Assuntos
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Conteúdo principal -->
        <main class="col-md-10 content-area">

            <!-- Mensagens de feedback -->
            <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${mensagem}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Conteúdo da página filha -->
            <div layout:fragment="content"></div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
