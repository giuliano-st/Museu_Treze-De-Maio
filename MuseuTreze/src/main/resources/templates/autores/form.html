<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Autor</title></head>
<body>
<div layout:fragment="content">

    <h2 class="mb-4">
        <i class="bi bi-person me-2"></i>
        <span th:if="${autor.id == null}">Novo Autor</span>
        <span th:if="${autor.id != null}">Editar Autor</span>
    </h2>

    <form th:action="${autor.id != null} ? @{/autores/{id}(id=${autor.id})} : @{/autores}"
          method="post">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control"
                               th:value="${autor.nome}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nacionalidade <span class="text-danger">*</span></label>
                        <input type="text" name="nacionalidade" class="form-control"
                               th:value="${autor.nacionalidade}" required>
                    </div>

                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-floppy me-1"></i>Salvar
            </button>
            <a th:href="@{/autores}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
        </div>

    </form>

</div>
</body>
</html>
