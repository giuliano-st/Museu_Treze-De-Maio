<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras - Museu Treze de Maio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { margin: 0; padding: 0; }
        nav { margin-bottom: 2rem; }
        nav ul { display: flex; list-style: none; gap: 1rem; margin: 0; padding: 1rem; background: var(--form-element-background-color); border-bottom: 1px solid var(--border-color); }
        nav a { text-decoration: none; color: var(--link-color); font-weight: 500; }
        .container { padding: 1rem; max-width: 1200px; margin: 0 auto; }
        .alert { padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-novo { margin-bottom: 1rem; }
        table { width: 100%; font-size: 0.9rem; }
        td, th { padding: 0.75rem; }
        .btn-group { display: flex; gap: 0.5rem; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><strong>Museu Treze de Maio</strong></li>
        <li><a href="/obras">Obras</a></li>
        <li><a href="/autores">Autores</a></li>
        <li><a href="/exemplares">Exemplares</a></li>
    </ul>
</nav>

<div class="container">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <h1>Obras</h1>
    <a href="/obras/nova" role="button" class="btn-novo">+ Nova Obra</a>

    <table th:if="${!obras.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="obra : ${obras}">
            <td th:text="${obra.id()}"></td>
            <td th:text="${obra.titulo_Principal()}"></td>
            <td th:text="${obra.obra_tipo()}"></td>
            <td th:text="${obra.autorNome()} ?: '-'"></td>
            <td th:text="${obra.isbn()} ?: '-'"></td>
            <td>
                <div class="btn-group">
                    <a th:href="@{/obras/{id}/editar(id=${obra.id()})}" role="button" class="btn-sm">Editar</a>
                    <form th:action="@{/obras/{id}/deletar(id=${obra.id()})}" method="POST" style="display: inline;">
                        <button type="submit" class="btn-sm" onclick="return confirm('Tem certeza?')">Deletar</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${obras.isEmpty()}"><em>Nenhuma obra cadastrada ainda.</em></p>
</div>
</body>
</html>
