<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Obras</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-book me-2"></i>Obras</h2>
        <a th:href="@{/obras/nova}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nova Obra
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Tipo</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Editora</th>
                        <th>ISBN / ISSN</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(obras)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhuma obra cadastrada.</td>
                    </tr>
                    <tr th:each="obra : ${obras}">
                        <td th:text="${obra.id}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${obra.obra_tipo == 'Livro'} ? 'bg-primary' : (${obra.obra_tipo == 'Revista'} ? 'bg-success' : 'bg-warning text-dark')"
                                  th:text="${obra.obra_tipo}"></span>
                        </td>
                        <td th:text="${obra.titulo_Principal}"></td>
                        <td th:text="${obra.autor != null ? obra.autor.nome : '-'}"></td>
                        <td th:text="${obra.editora != null ? obra.editora.nome : '-'}"></td>
                        <td>
                            <span th:if="${obra.isbn != null}" th:text="${obra.isbn}"></span>
                            <span th:if="${obra.issn != null}" th:text="${obra.issn}"></span>
                            <span th:if="${obra.isbn == null && obra.issn == null}">-</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/obras/{id}/editar(id=${obra.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/obras/{id}/deletar(id=${obra.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja deletar esta obra?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
