<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Obra - Museu Treze de Maio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { margin: 0; padding: 0; }
        nav { margin-bottom: 2rem; }
        nav ul { display: flex; list-style: none; gap: 1rem; margin: 0; padding: 1rem; background: var(--form-element-background-color); border-bottom: 1px solid var(--border-color); }
        nav a { text-decoration: none; color: var(--link-color); font-weight: 500; }
        .container { padding: 1rem; max-width: 800px; margin: 0 auto; }
        .alert { padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select, textarea { width: 100%; box-sizing: border-box; }
        .btn-group { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn-group button { flex: 1; }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><strong>Museu Treze de Maio</strong></li>
        <li><a href="/obras">Obras</a></li>
        <li><a href="/autores">Autores</a></li>
        <li><a href="/exemplares">Exemplares</a></li>
    </ul>
</nav>

<div class="container">
    <h1 th:if="${obra == null}">Nova Obra</h1>
    <h1 th:if="${obra != null && obra.id() != null}">Editar Obra</h1>

    <form th:action="${obra != null && obra.id() != null} ? @{/obras/{id}(id=${obra.id()})} : @{/obras}"
          method="POST">

        <div class="form-group">
            <label for="obra_tipo">Tipo de Obra *</label>
            <input type="text" id="obra_tipo" name="obra_tipo"
                   th:value="${obra?.obra_tipo()}" required>
        </div>

        <div class="form-group">
            <label for="titulo_Principal">Título Principal *</label>
            <input type="text" id="titulo_Principal" name="titulo_Principal"
                   th:value="${obra?.titulo_Principal()}" required>
        </div>

        <div class="form-group">
            <label for="autorId">Autor</label>
            <select id="autorId" name="autorId">
                <option value="">-- Selecione um autor --</option>
                <option th:each="autor : ${autores}"
                        th:value="${autor.id()}"
                        th:text="${autor.nome()}"
                        th:selected="${obra?.autorId() == autor.id()}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="editoraId">Editora</label>
            <select id="editoraId" name="editoraId">
                <option value="">-- Selecione uma editora --</option>
                <option th:each="editora : ${editoras}"
                        th:value="${editora.id()}"
                        th:text="${editora.nome()}"
                        th:selected="${obra?.editoraId() == editora.id()}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="assuntosIds">Assuntos</label>
            <select id="assuntosIds" name="assuntosIds" multiple>
                <option th:each="assunto : ${assuntos}"
                        th:value="${assunto.id()}"
                        th:text="${assunto.descricao()}"></option>
            </select>
            <small>Segure Ctrl (ou Cmd) para selecionar múltiplos</small>
        </div>

        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn" th:value="${obra?.isbn()}">
        </div>

        <div class="form-group">
            <label for="issn">ISSN</label>
            <input type="text" id="issn" name="issn" th:value="${obra?.issn()}">
        </div>

        <div class="form-group">
            <label for="edicao">Edição</label>
            <input type="text" id="edicao" name="edicao" th:value="${obra?.edicao()}">
        </div>

        <div class="form-group">
            <label for="numeroChamada">Número de Chamada</label>
            <input type="text" id="numeroChamada" name="numeroChamada" th:value="${obra?.numeroChamada()}">
        </div>

        <div class="form-group">
            <label for="descFisica">Descrição Física</label>
            <textarea id="descFisica" name="descFisica" rows="3" th:text="${obra?.descFisica()}"></textarea>
        </div>

        <div class="form-group">
            <label for="notasGerais">Notas Gerais</label>
            <textarea id="notasGerais" name="notasGerais" rows="3" th:text="${obra?.notasGerais()}"></textarea>
        </div>

        <div class="btn-group">
            <button type="submit" role="button">Salvar</button>
            <a href="/obras" role="button" class="secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
