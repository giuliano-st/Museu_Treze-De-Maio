<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Assunto</title></head>
<body>
<div layout:fragment="content">

    <h2 class="mb-4">
        <i class="bi bi-tag me-2"></i>
        <span th:if="${assunto.id == null}">Novo Assunto</span>
        <span th:if="${assunto.id != null}">Editar Assunto</span>
    </h2>

    <form th:action="${assunto.id != null} ? @{/assuntos/{id}(id=${assunto.id})} : @{/assuntos}"
          method="post">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Descrição <span class="text-danger">*</span></label>
                        <input type="text" name="descricao" class="form-control"
                               th:value="${assunto.descricao}" required>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-floppy me-1"></i>Salvar
            </button>
            <a th:href="@{/assuntos}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
        </div>

    </form>

</div>
</body>
</html>
