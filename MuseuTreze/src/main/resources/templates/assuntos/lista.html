<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Assuntos</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-tag me-2"></i>Assuntos</h2>
        <a th:href="@{/assuntos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Assunto
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Descrição</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(assuntos)}">
                        <td colspan="3" class="text-center text-muted py-4">Nenhum assunto cadastrado.</td>
                    </tr>
                    <tr th:each="assunto : ${assuntos}">
                        <td th:text="${assunto.id}"></td>
                        <td th:text="${assunto.descricao}"></td>
                        <td class="text-center">
                            <a th:href="@{/assuntos/{id}/editar(id=${assunto.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/assuntos/{id}/deletar(id=${assunto.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja deletar este assunto?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
