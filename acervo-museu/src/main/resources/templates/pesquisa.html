<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acervo — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-7xl mx-auto px-4 py-10 flex-1">
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-[#2E5B37] mb-2">Acervo Digital</h1>
        <p class="text-gray-500">Explore nossa coleção de livros, revistas e jornais</p>
    </div>

    <!-- Layout catálogo vertical -->
    <div class="flex gap-8">

        <!-- FILTROS LATERAIS -->
        <aside class="w-64 shrink-0">
            <form method="get" action="/pesquisa" class="bg-white border-2 border-[#2E5B37] rounded-xl p-5 sticky top-4">
                <div class="text-[#2E5B37] font-bold mb-5">🔍 Filtros</div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#2E5B37] mb-1">Buscar</label>
                    <input type="text" name="termo" th:value="${termo}" placeholder="Título, autor..."
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm focus:border-[#2E5B37] focus:outline-none"/>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#2E5B37] mb-1">Tipo</label>
                    <select name="tipo" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm focus:border-[#2E5B37] focus:outline-none bg-white">
                        <option value="">Todos</option>
                        <option value="LIVRO" th:selected="${tipo == 'LIVRO'}">Livro</option>
                        <option value="JORNAL" th:selected="${tipo == 'JORNAL'}">Jornal</option>
                        <option value="REVISTA" th:selected="${tipo == 'REVISTA'}">Revista</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#2E5B37] mb-1">Categoria</label>
                    <select name="categoria" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm focus:border-[#2E5B37] focus:outline-none bg-white">
                        <option value="">Todas</option>
                        <option value="História" th:selected="${categoria == 'História'}">História</option>
                        <option value="Cultura" th:selected="${categoria == 'Cultura'}">Cultura</option>
                        <option value="Literatura" th:selected="${categoria == 'Literatura'}">Literatura</option>
                        <option value="Artes" th:selected="${categoria == 'Artes'}">Artes</option>
                        <option value="Biografias" th:selected="${categoria == 'Biografias'}">Biografias</option>
                    </select>
                </div>

                <!-- Filtro por data -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#2E5B37] mb-1">📅 Data de publicação</label>
                    <input type="text" name="dataInicio" th:value="${dataInicio}" placeholder="De (ex: 1990)"
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm mb-2 focus:border-[#2E5B37] focus:outline-none"/>
                    <input type="text" name="dataFim" th:value="${dataFim}" placeholder="Até (ex: 2020)"
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm focus:border-[#2E5B37] focus:outline-none"/>
                </div>

                <button type="submit"
                        class="w-full bg-[#2E5B37] text-white py-2.5 rounded-lg font-semibold hover:bg-[#1f4026] text-sm">
                    Pesquisar
                </button>
                <a href="/pesquisa" class="block w-full mt-2 py-2 text-sm text-center text-gray-500 hover:text-[#2E5B37]">
                    Limpar filtros
                </a>
            </form>
        </aside>

        <!-- RESULTADOS -->
        <div class="flex-1">
            <p class="text-gray-500 text-sm mb-5">
                <span th:text="${obras.size()}"></span> obra(s) encontrada(s)
            </p>

            <!-- Sem resultados -->
            <div th:if="${obras.empty}" class="text-center py-20">
                <div class="text-6xl mb-4">📚</div>
                <p class="text-gray-400">Nenhuma obra encontrada. Tente outros filtros.</p>
            </div>

            <!-- Grid de cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div th:each="obra : ${obras}"
                     class="bg-white border-2 border-gray-200 rounded-xl overflow-hidden hover:border-[#2E5B37] hover:shadow-lg transition-all duration-300 flex flex-col">

                    <!-- Capa -->
                    <div class="h-56 bg-gray-100 overflow-hidden">
                        <img th:src="${obra.capa != null and !obra.capa.isEmpty()} ? ${obra.capa} : 'https://via.placeholder.com/400x600?text=Sem+Capa'"
                             th:alt="${obra.titulo}"
                             class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"/>
                    </div>

                    <!-- Conteúdo -->
                    <div class="p-4 flex flex-col flex-1">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="bg-[#2E5B37] text-white text-xs px-2 py-0.5 rounded-full" th:text="${obra.tipo}"></span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                                  th:classappend="${obra.status == 'DISPONIVEL'} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                                  th:text="${obra.status}"></span>
                        </div>

                        <h3 class="font-bold text-[#2E5B37] line-clamp-2 mb-2" th:text="${obra.titulo}"></h3>

                        <div class="space-y-1 text-sm text-gray-500 mb-3">
                            <div th:if="${obra.autor}">👤 <span th:text="${obra.autor}"></span></div>
                            <div th:if="${obra.dataPublicacao}">📅 <span th:text="${obra.dataPublicacao}"></span></div>
                            <div th:if="${obra.categoria}">🏷️ <span th:text="${obra.categoria}"></span></div>
                        </div>

                        <p class="text-gray-500 text-sm line-clamp-3 flex-1 mb-4" th:text="${obra.descricao}"></p>

                        <a th:href="@{/obra/{id}(id=${obra.id})}"
                           class="w-full text-center bg-[#2E5B37] text-white py-2.5 rounded-lg hover:bg-[#1f4026] transition-colors text-sm font-medium block">
                            Ver Detalhes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-[#2E5B37] text-white text-center py-4 text-sm mt-8">
    Museu Treze de Maio — Sistema de Acervo Digital
</footer>
</body>
</html>
