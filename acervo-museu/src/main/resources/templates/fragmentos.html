<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { museu: '#2E5B37' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- NAVBAR -->
<nav th:fragment="navbar" class="bg-[#2E5B37] shadow-lg">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
        <a href="/" class="flex items-center gap-3 text-white font-semibold text-lg">
            🏛️ Museu Treze de Maio
        </a>
        <div class="flex items-center gap-2">
            <a href="/pesquisa" class="text-white px-3 py-2 rounded-lg hover:bg-white/20 text-sm font-medium">Acervo</a>

            <!-- Links só para admin -->
            <th:block th:if="${session.usuario != null and session.usuario.papel == 'ADMINISTRADOR'}">
                <a href="/cadastro" class="text-white px-3 py-2 rounded-lg hover:bg-white/20 text-sm font-medium">Cadastrar</a>
                <a href="/admin" class="text-white px-3 py-2 rounded-lg hover:bg-white/20 text-sm font-medium">Painel</a>
            </th:block>

            <!-- Usuário logado -->
            <th:block th:if="${session.usuario != null}">
                <span class="text-white/70 text-sm" th:text="${session.usuario.nome}"></span>
                <a href="/logout" class="bg-white text-[#2E5B37] px-3 py-2 rounded-lg text-sm font-semibold hover:bg-gray-100">Sair</a>
            </th:block>

            <!-- Não logado -->
            <th:block th:if="${session.usuario == null}">
                <a href="/login" class="bg-white text-[#2E5B37] px-3 py-2 rounded-lg text-sm font-semibold hover:bg-gray-100">Entrar</a>
            </th:block>
        </div>
    </div>
</nav>

</body>
</html>
