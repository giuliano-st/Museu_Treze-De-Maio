<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar Obra — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-3xl mx-auto px-4 py-12 flex-1">
    <div class="text-center mb-10">
        <h1 class="text-3xl font-bold text-[#2E5B37] mb-2">Cadastrar Obra</h1>
        <p class="text-gray-500">Escolha o tipo de obra para cadastrar</p>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        <a href="/cadastro/livro"
           class="bg-white border-2 border-[#2E5B37] rounded-xl p-8 text-center hover:shadow-xl hover:bg-[#2E5B37] hover:text-white group transition-all duration-300">
            <div class="text-5xl mb-4">📖</div>
            <h3 class="font-bold text-lg text-[#2E5B37] group-hover:text-white">Livro</h3>
            <p class="text-gray-500 text-sm mt-1 group-hover:text-white/80">Cadastrar um livro</p>
        </a>
        <a href="/cadastro/jornal"
           class="bg-white border-2 border-[#2E5B37] rounded-xl p-8 text-center hover:shadow-xl hover:bg-[#2E5B37] hover:text-white group transition-all duration-300">
            <div class="text-5xl mb-4">📰</div>
            <h3 class="font-bold text-lg text-[#2E5B37] group-hover:text-white">Jornal</h3>
            <p class="text-gray-500 text-sm mt-1 group-hover:text-white/80">Cadastrar um jornal</p>
        </a>
        <a href="/cadastro/revista"
           class="bg-white border-2 border-[#2E5B37] rounded-xl p-8 text-center hover:shadow-xl hover:bg-[#2E5B37] hover:text-white group transition-all duration-300">
            <div class="text-5xl mb-4">📔</div>
            <h3 class="font-bold text-lg text-[#2E5B37] group-hover:text-white">Revista</h3>
            <p class="text-gray-500 text-sm mt-1 group-hover:text-white/80">Cadastrar uma revista</p>
        </a>
    </div>
</main>

<footer class="bg-[#2E5B37] text-white text-center py-4 text-sm mt-8">
    Museu Treze de Maio — Sistema de Acervo Digital
</footer>
</body>
</html>
