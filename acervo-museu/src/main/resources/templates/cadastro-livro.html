<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar Livro — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-4xl mx-auto px-4 py-8 flex-1">
    <a href="/cadastro" class="inline-flex items-center gap-2 text-[#2E5B37] hover:underline text-sm mb-6">← Voltar</a>

    <div class="bg-white border-2 border-[#2E5B37] rounded-xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="bg-[#2E5B37] text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-md">📖</div>
            <h1 class="text-[#2E5B37] text-2xl font-bold" th:text="${obra.id != null} ? 'Editar Livro' : 'Cadastrar Livro'"></h1>
        </div>

        <form th:action="@{/cadastro/livro}" method="post" class="space-y-8">
            <input type="hidden" name="id" th:value="${obra.id}"/>

            <!-- Identificação -->
            <section>
                <h3 class="text-[#2E5B37] font-bold mb-4 pb-2 border-b-2 border-[#2E5B37]">Identificação</h3>
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Chamada</label>
                        <input type="text" name="chamada" th:value="${obra.chamada}" placeholder="Código de chamada"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Chamada Local</label>
                        <input type="text" name="chamadaLocal" th:value="${obra.chamadaLocal}" placeholder="Código local"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">ISBN <span class="text-gray-400 font-normal">(opcional)</span></label>
                        <input type="text" name="isbn" th:value="${obra.isbn}" placeholder="978-3-16-148410-0"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Exemplar</label>
                        <input type="text" name="exemplar" th:value="${obra.exemplar}" placeholder="Ex: 1º exemplar"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                </div>
            </section>

            <!-- Autoria -->
            <section>
                <h3 class="text-[#2E5B37] font-bold mb-4 pb-2 border-b-2 border-[#2E5B37]">Autoria</h3>
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Autor Principal *</label>
                        <input type="text" name="autor" th:value="${obra.autor}" required placeholder="Nome do autor"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Colaboradores</label>
                        <input type="text" name="colaboradores" th:value="${obra.colaboradores}" placeholder="Nomes dos colaboradores"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Título Principal *</label>
                        <input type="text" name="titulo" th:value="${obra.titulo}" required placeholder="Título do livro"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Título Original</label>
                        <input type="text" name="tituloOriginal" th:value="${obra.tituloOriginal}" placeholder="Título original (se tradução)"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                </div>
            </section>

            <!-- Publicação -->
            <section>
                <h3 class="text-[#2E5B37] font-bold mb-4 pb-2 border-b-2 border-[#2E5B37]">Publicação</h3>
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Edição</label>
                        <input type="text" name="edicao" th:value="${obra.edicao}" placeholder="1ª edição"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Editora</label>
                        <input type="text" name="editora" th:value="${obra.editora}" placeholder="Nome da editora"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Local de Publicação</label>
                        <input type="text" name="localPublicacao" th:value="${obra.localPublicacao}" placeholder="Cidade, Estado"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Data de Publicação</label>
                        <input type="text" name="dataPublicacao" th:value="${obra.dataPublicacao}" placeholder="Ano ou data"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Série</label>
                        <input type="text" name="serie" th:value="${obra.serie}" placeholder="Nome da série"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Coleção</label>
                        <input type="text" name="colecao" th:value="${obra.colecao}" placeholder="Nome da coleção"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Categoria</label>
                        <input type="text" name="categoria" th:value="${obra.categoria}" placeholder="Ex: História, Cultura"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Páginas</label>
                        <input type="text" name="paginas" th:value="${obra.paginas}" placeholder="Ex: 256 p., il., 23 cm"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                </div>
            </section>

            <!-- Detalhes e Admin -->
            <section>
                <h3 class="text-[#2E5B37] font-bold mb-4 pb-2 border-b-2 border-[#2E5B37]">Detalhes e Informações Administrativas</h3>
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Assuntos</label>
                        <input type="text" name="assuntos" th:value="${obra.assuntos}" placeholder="Separe por vírgula"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">URL da Capa</label>
                        <input type="url" name="capa" th:value="${obra.capa}" placeholder="https://..."
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Localização Física</label>
                        <input type="text" name="localizacaoFisica" th:value="${obra.localizacaoFisica}" placeholder="Ex: Estante A, Prateleira 3"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Doador</label>
                        <input type="text" name="doador" th:value="${obra.doador}" placeholder="Nome de quem doou (se houver)"
                               class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                    </div>
                </div>
                <div class="mt-5">
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Notas Internas</label>
                    <textarea rows="3" name="notasInternas" th:text="${obra.notasInternas}" placeholder="Informações adicionais"
                              class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"></textarea>
                </div>
            </section>

            <div class="flex gap-4 pt-2">
                <button type="submit"
                        class="flex-1 bg-[#2E5B37] text-white py-3 rounded-lg font-bold hover:bg-[#1f4026] transition-colors"
                        th:text="${obra.id != null} ? 'Salvar Alterações' : 'Cadastrar Livro'"></button>
                <a href="/cadastro" class="px-8 py-3 border-2 border-[#2E5B37] text-[#2E5B37] rounded-lg hover:bg-gray-50 transition-colors text-center">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer class="bg-[#2E5B37] text-white text-center py-4 text-sm mt-8">
    Museu Treze de Maio — Sistema de Acervo Digital
</footer>
</body>
</html>
