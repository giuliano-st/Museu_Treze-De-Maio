<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white border-2 border-[#2E5B37] rounded-xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="bg-[#2E5B37] text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-md">🔑</div>
            <h2 class="text-[#2E5B37] text-2xl font-bold">Entrar</h2>
            <p class="text-gray-500 text-sm mt-1">Acesse o sistema do Museu Treze de Maio</p>
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}" class="bg-red-50 border border-red-300 rounded-lg p-3 flex items-center gap-2 text-red-700 text-sm mb-4">
            ⚠️ <span th:text="${erro}"></span>
        </div>

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com"
                       class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none transition-colors"/>
            </div>
            <div>
                <label class="block mb-1 text-[#2E5B37] font-medium text-sm">Senha</label>
                <input type="password" name="senha" required placeholder="••••••••"
                       class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none transition-colors"/>
            </div>
            <button type="submit"
                    class="w-full bg-[#2E5B37] text-white py-3 rounded-lg font-bold hover:bg-[#1f4026] transition-colors">
                Entrar
            </button>
            <p class="text-center text-gray-500 text-sm">
                Não tem conta? <a href="/register" class="text-[#2E5B37] font-semibold hover:underline">Cadastre-se</a>
            </p>
        </form>
    </div>
</main>

<footer class="bg-[#2E5B37] text-white text-center py-4 text-sm">
    Museu Treze de Maio — Sistema de Acervo Digital
</footer>
</body>
</html>
