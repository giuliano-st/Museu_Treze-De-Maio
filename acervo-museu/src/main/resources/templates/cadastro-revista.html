<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar Revista — Museu Treze de Maio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="max-w-4xl mx-auto px-4 py-8 flex-1">
    <a href="/cadastro" class="inline-flex items-center gap-2 text-[#2E5B37] hover:underline text-sm mb-6">← Voltar</a>

    <div class="bg-white border-2 border-[#2E5B37] rounded-xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="bg-[#2E5B37] text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-md">📔</div>
            <h1 class="text-[#2E5B37] text-2xl font-bold">Cadastrar Revista</h1>
        </div>

        <form th:action="@{/cadastro/revista}" method="post" class="space-y-5">
            <input type="hidden" name="id" th:value="${obra.id}"/>
            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Título *</label>
                    <input type="text" name="titulo" th:value="${obra.titulo}" required placeholder="Nome da revista"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Número da Edição</label>
                    <input type="text" name="numeroEdicao" th:value="${obra.numeroEdicao}" placeholder="Vol. 5, Nº 12"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Mês</label>
                    <select name="mes" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm bg-white">
                        <option value="">Selecione</option>
                        <option th:each="m : ${ {'Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'} }"
                                th:value="${m}" th:text="${m}" th:selected="${obra.mes == m}"></option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Ano</label>
                    <input type="text" name="dataPublicacao" th:value="${obra.dataPublicacao}" placeholder="2024"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">ISSN</label>
                    <input type="text" name="issn" th:value="${obra.issn}" placeholder="XXXX-XXXX"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Editora</label>
                    <input type="text" name="editora" th:value="${obra.editora}" placeholder="Nome da editora"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Periodicidade</label>
                    <input type="text" name="periodicidade" th:value="${obra.periodicidade}" placeholder="Mensal, Bimestral..."
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Categoria</label>
                    <input type="text" name="categoria" th:value="${obra.categoria}" placeholder="Ex: Cultura, Artes"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Localização Física</label>
                    <input type="text" name="localizacaoFisica" th:value="${obra.localizacaoFisica}" placeholder="Ex: Estante B"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
                <div>
                    <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Doador</label>
                    <input type="text" name="doador" th:value="${obra.doador}" placeholder="Nome de quem doou (se houver)"
                           class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
                </div>
            </div>
            <div>
                <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">Assuntos</label>
                <input type="text" name="assuntos" th:value="${obra.assuntos}" placeholder="Separe por vírgula"
                       class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
            </div>
            <div>
                <label class="block mb-1.5 text-[#2E5B37] font-medium text-sm">URL da Capa</label>
                <input type="url" name="capa" th:value="${obra.capa}" placeholder="https://..."
                       class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-[#2E5B37] focus:outline-none text-sm"/>
            </div>
            <div class="flex gap-4 pt-2">
                <button type="submit" class="flex-1 bg-[#2E5B37] text-white py-3 rounded-lg font-bold hover:bg-[#1f4026]">Cadastrar Revista</button>
                <a href="/cadastro" class="px-8 py-3 border-2 border-[#2E5B37] text-[#2E5B37] rounded-lg hover:bg-gray-50 text-center">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer class="bg-[#2E5B37] text-white text-center py-4 text-sm mt-8">Museu Treze de Maio — Sistema de Acervo Digital</footer>
</body>
</html>
